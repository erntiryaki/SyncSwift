name: iOS TestFlight Build & Deploy

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-and-deploy:
    name: Build & Upload to TestFlight
    runs-on: macos-14
    environment: testflight
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Select Xcode 16
        run: |
          XCODE_APP=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
          if [ -n "$XCODE_APP" ]; then
            echo "Selecting $XCODE_APP"
            sudo xcode-select -switch "$XCODE_APP"
          elif [ -d "/Applications/Xcode.app" ]; then
            echo "Falling back to /Applications/Xcode.app"
            sudo xcode-select -switch /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up .env.local file
        run: |
          cat <<EOF > .env.local
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          BREVO_API_KEY=${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL=${{ secrets.BREVO_SENDER_EMAIL }}
          AWS_SES_ACCESS_KEY_ID=${{ secrets.AWS_SES_ACCESS_KEY_ID }}
          AWS_SES_SECRET_ACCESS_KEY=${{ secrets.AWS_SES_SECRET_ACCESS_KEY }}
          AWS_SES_REGION=${{ secrets.AWS_SES_REGION }}
          AWS_SES_SENDER_EMAIL=${{ secrets.AWS_SES_SENDER_EMAIL }}
          REVENUECAT_API_KEY=${{ secrets.REVENUECAT_API_KEY }}
          ADMOB_BANNER_ID=${{ secrets.ADMOB_BANNER_ID }}
          EOF

      - name: Install Apple Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 || vars.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD || vars.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 || vars.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || vars.KEYCHAIN_PASSWORD }}
        run: |
          # Create temporary keychain
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo "Secret check:"
          echo "  - BUILD_CERTIFICATE_BASE64 present: $([ -n "$BUILD_CERTIFICATE_BASE64" ] && echo 'YES' || echo 'NO')"
          echo "  - P12_PASSWORD present: $([ -n "$P12_PASSWORD" ] && echo 'YES' || echo 'NO')"
          echo "  - KEYCHAIN_PASSWORD present: $([ -n "$KEYCHAIN_PASSWORD" ] && echo 'YES' || echo 'NO')"
          echo "  - BUILD_PROVISION_PROFILE_BASE64 present: $([ -n "$BUILD_PROVISION_PROFILE_BASE64" ] && echo 'YES' || echo 'NO')"

          # Check required secrets
          if [ -z "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "::error::BUILD_CERTIFICATE_BASE64 secret is missing or empty! Please check https://github.com/erntiryaki/SyncSwift/settings/secrets/actions"
            exit 1
          fi
          if [ -z "$P12_PASSWORD" ]; then
            echo "::error::P12_PASSWORD secret is missing or empty!"
            exit 1
          fi
          if [ -z "$KEYCHAIN_PASSWORD" ]; then
            echo "::error::KEYCHAIN_PASSWORD secret is missing or empty!"
            exit 1
          fi

          # Import certificate and profile from secrets using python for reliable decoding
          python3 -c "import base64, os; open('$CERTIFICATE_PATH', 'wb').write(base64.b64decode(os.environ['BUILD_CERTIFICATE_BASE64']))"
          python3 -c "import base64, os; open('$PP_PATH', 'wb').write(base64.b64decode(os.environ['BUILD_PROVISION_PROFILE_BASE64']))"

          echo "Certificate size: $(wc -c < "$CERTIFICATE_PATH") bytes"
          echo "Profile size: $(wc -c < "$PP_PATH") bytes"

          # Convert PKCS12 to legacy format compatible with macOS SecKeychainItemImport
          openssl pkcs12 -in "$CERTIFICATE_PATH" -nodes -passin pass:"$P12_PASSWORD" -out "$RUNNER_TEMP/cert_key.pem"
          openssl pkcs12 -export -in "$RUNNER_TEMP/cert_key.pem" -out "$CERTIFICATE_PATH" -password pass:"$P12_PASSWORD" -legacy || \
          openssl pkcs12 -export -in "$RUNNER_TEMP/cert_key.pem" -out "$CERTIFICATE_PATH" -password pass:"$P12_PASSWORD"
          rm -f "$RUNNER_TEMP/cert_key.pem"

          # Create and configure keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate and private key to keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t agg -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Apply provisioning profile with its real UUID and extract exact profile name
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_INFO=$(python3 -c "import plistlib; data = open('$PP_PATH', 'rb').read(); start = data.find(b'<?xml'); end = data.find(b'</plist>') + 8; p = plistlib.loads(data[start:end]); team = p.get('TeamIdentifier', [''])[0]; print(f'{p[\"UUID\"]}|{p[\"Name\"]}|{team}')")
          IFS='|' read -r PROFILE_UUID PROFILE_NAME PROFILE_TEAM <<< "$PROFILE_INFO"

          echo "Detected Profile UUID: $PROFILE_UUID"
          echo "Detected Profile Name: $PROFILE_NAME"
          echo "Detected Team ID: $PROFILE_TEAM"

          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID".mobileprovision

          echo "ACTUAL_PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_ENV
          echo "ACTUAL_PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV
          if [ -n "$PROFILE_TEAM" ]; then
            echo "ACTUAL_TEAM_ID=$PROFILE_TEAM" >> $GITHUB_ENV
          fi

      - name: Prepare Gradle Wrapper
        run: |
          chmod +x gradlew
          sed -i '' '/org.gradle.java.home/d' gradle.properties 2>/dev/null || true
          mkdir -p iosApp/iosApp
          cp iosApp/Info.plist iosApp/iosApp/Info.plist 2>/dev/null || true
          cp -R iosApp/Assets.xcassets iosApp/iosApp/Assets.xcassets 2>/dev/null || true

      - name: Create ExportOptions.plist
        run: |
          TEAM_ID="${ACTUAL_TEAM_ID:-${{ secrets.APPLE_TEAM_ID || vars.APPLE_TEAM_ID }}}"
          cat <<EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>destination</key>
              <string>export</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>$TEAM_ID</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>net.syncswift</key>
                  <string>$ACTUAL_PROFILE_NAME</string>
              </dict>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>manageAppVersionAndBuildNumber</key>
              <false/>
          </dict>
          </plist>
          EOF

      - name: Build Archive & Export IPA
        run: |
          TEAM_ID="${ACTUAL_TEAM_ID:-${{ secrets.APPLE_TEAM_ID || vars.APPLE_TEAM_ID }}}"
          xcodebuild -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/iosApp.xcarchive \
            archive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$ACTUAL_PROFILE_NAME" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_REQUIRED=YES \
            CODE_SIGN_ALLOWED=YES

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/iosApp.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export

      - name: Upload IPA to App Store Connect / TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID || vars.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID || vars.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY || vars.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys ~/.private_keys
          echo -n "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          cp ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8 ~/.private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

          IPA_PATH=$(find $RUNNER_TEMP/export -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "::error::Exported IPA not found in $RUNNER_TEMP/export"
            exit 1
          fi
          echo "Found IPA to upload: $IPA_PATH"

          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
