[package]
name = "syncswift-desktop"
version = "2.0.0"
description = "SyncSwift Desktop Client"
authors = ["SyncSwift Team"]
edition = "2021"

[lib]
name = "syncswift_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[workspace]
members = [
    "crates/syncswift-core",
    "crates/agent"
]

[dependencies]
syncswift-core = { path = "crates/syncswift-core" }
syncswift-agent = { path = "crates/agent" }
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.0.0"
tauri-plugin-autostart = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
base64 = "0.22"
hostname = "0.4"
