<!doctype html>
<html lang="en" style="background-color: #121829;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./assets/logo-icon/app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SyncSwift</title>
    <style>
      html, body, #root {
        background-color: #121829;
        color: #ffffff;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        min-height: 100vh;
      }
    </style>
    <script>
      window.addEventListener('error', function(e) {
        console.error('Global window error:', e);
        var el = document.getElementById('fatal-error-overlay');
        if (!el && document.body) {
          el = document.createElement('div');
          el.id = 'fatal-error-overlay';
          el.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#121829;color:#ef4444;padding:32px;z-index:999999;font-family:sans-serif;box-sizing:border-box;overflow:auto;';
          el.innerHTML = '<h3 style="color:#f87171;margin-top:0;">SyncSwift Hata</h3><pre id="fatal-error-text" style="color:#e2e8f0;white-space:pre-wrap;font-size:12px;"></pre><button onclick="localStorage.clear();window.location.reload();" style="margin-top:16px;padding:8px 16px;background:#2563eb;color:#fff;border:none;border-radius:8px;cursor:pointer;">Verileri Sıfırla ve Yeniden Başlat</button>';
          document.body.appendChild(el);
        }
        var txt = document.getElementById('fatal-error-text');
        if (txt) {
          txt.innerText += (e.message || e.toString()) + ' at ' + (e.filename || '') + ':' + (e.lineno || '') + '\n';
        }
      });
    </script>
  </head>
  <body style="background-color: #121829; color: #ffffff;">
    <div id="root" style="background-color: #121829;"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
